[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-manager"
version = "0.0.2"
description = "Desktop task harness manager for Codex, Claude Code, and OpenCode"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["PySide6>=6.7"]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pyinstaller>=6.8"]

[project.scripts]
harness-manager = "harness_manager.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
harness_manager = ["resources/*.ico", "resources/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
