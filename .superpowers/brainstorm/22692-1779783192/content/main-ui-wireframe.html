<h2>主界面草图：三栏工作台</h2>
<p class="subtitle">目标是让“导入 skill -> 组织 pkg -> 安装/卸载到客户端”在一个窗口里完成。</p>

<div class="mockup">
  <div class="mockup-header">SkillPkgManager</div>
  <div class="mockup-body">
    <div style="display:grid;grid-template-columns:220px 1fr 320px;gap:14px;min-height:430px;">
      <div class="mock-sidebar">
        <div class="label">客户端</div>
        <div class="placeholder" style="height:auto;padding:10px;text-align:left;">Codex<br><small>已识别: C:\Users\...\.codex\skills</small></div>
        <div class="placeholder" style="height:auto;padding:10px;text-align:left;">Claude Code<br><small>未识别，需配置</small></div>
        <div class="placeholder" style="height:auto;padding:10px;text-align:left;">OpenCode<br><small>已识别</small></div>
        <button class="mock-button" style="width:100%;margin-top:12px;">从客户端导入</button>
        <button class="mock-button" style="width:100%;margin-top:8px;">路径设置</button>
      </div>

      <div class="mock-content">
        <div class="label">Pkg 集合</div>
        <div style="display:flex;gap:8px;margin:8px 0 14px;">
          <button class="mock-button">新建 pkg</button>
          <button class="mock-button">导入离线包</button>
          <button class="mock-button">导出离线包</button>
        </div>
        <div class="placeholder" style="height:auto;padding:12px;text-align:left;">工作A <small>2 skills: A1, A2</small></div>
        <div class="placeholder" style="height:auto;padding:12px;text-align:left;">写作工作流 <small>5 skills</small></div>
        <div class="placeholder" style="height:auto;padding:12px;text-align:left;">代码审查 <small>3 skills</small></div>
      </div>

      <div class="mock-content">
        <div class="label">当前 pkg：工作A</div>
        <div style="display:flex;gap:8px;margin:8px 0 14px;">
          <button class="mock-button">添加 skill</button>
          <button class="mock-button">移除</button>
        </div>
        <div class="placeholder" style="height:auto;padding:12px;text-align:left;">A1 <small>来源: Codex</small></div>
        <div class="placeholder" style="height:auto;padding:12px;text-align:left;">A2 <small>来源: OpenCode</small></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px;">
          <button class="mock-button">安装到 Codex</button>
          <button class="mock-button">卸载 Codex</button>
          <button class="mock-button">安装到 Claude</button>
          <button class="mock-button">卸载 Claude</button>
          <button class="mock-button">安装到 OpenCode</button>
          <button class="mock-button">卸载 OpenCode</button>
        </div>
      </div>
    </div>
  </div>
</div>
